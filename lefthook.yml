pre-commit:
  commands:
    lint-fix:
      run: pnpm lint:fix
      stage_fixed: true

pre-push:
  commands:
    branch-name:
      run: git rev-parse --abbrev-ref HEAD | grep -Eq '^(main|dev|piyush|nirmal|feature/.+|bugfix/.+|hotfix/.+)$'

    lint-check:
      glob: "*.{js,ts,tsx,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      exclude:
        - "coverage/**"
        - "dist/**"
      run: pnpm lint:check

commit-msg:
  commands:
    commitlint:
      run: pnpm dlx commitlint --edit {1}